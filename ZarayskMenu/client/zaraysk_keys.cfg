// OPTIONAL, execute on the CLIENT: exec zaraysk_keys
// Save your previous bindings first. Stock slot commands remain and may switch weapons while selecting.
bind "1" "slot1;say /zm1"
bind "2" "slot2;say /zm2"
bind "3" "slot3;say /zm3"
bind "4" "slot4;say /zm4"
bind "5" "slot5;say /zm5"
bind "6" "slot6;say /zm6"
bind "7" "slot7;say /zm7"
bind "8" "slot8;say /zm8"
bind "9" "slot9;say /zm9"
bind "0" "slot10;say /zm0"
// F6 toggles the panel; F7 always closes it and releases cursor.
bind "F6" "say /menu"
bind "F7" "say /zmenu_close"
// MOUSE4 enables/disables the cursor for clicking menu rows.
bind "MOUSE4" "css_zmenu_mouse"
